# Claude Request Forwarder Configuration
# 完整配置示例，展示所有可用的配置选项

# 全局时区配置 - 影响所有时间相关功能
# 留空或不配置时自动跟随系统时区（也可显式写 "local"）
# timezone: "Asia/Shanghai"    # 显式指定示例，其他有效值: "UTC", "America/New_York", "Europe/London" 等
# 日志配置
logging:
  level: "debug"          # 日志级别: debug, info, warn, error，默认: info
  format: "text"         # 日志格式: "json" 或 "text"，默认: text
  
  # 文件日志配置 (可选)
  file_enabled: true            # 是否启用文件日志，默认: false
  file_path: "logs/app.log"      # 日志文件路径，默认: logs/app.log
  max_file_size: "50MB"         # 单个日志文件最大大小，支持: KB, MB, GB，默认: 100MB
  max_files: 10                  # 最多保留的轮转文件数量，默认: 10
  compress_rotated: true         # 是否压缩轮转的旧日志文件，默认: false
  disable_response_limit: true   # 启用文件日志时是否取消响应内容输出限制，默认: false

  # Token调试配置 - 用于调试Token解析失败问题
  token_debug:
    enabled: true                 # 是否启用Token调试功能，默认: false (生产环境建议关闭)
    save_path: "logs"             # 调试文件保存目录，默认: logs
    max_files: 0                 # 最大保留调试文件数量，默认: 50 (0=不限制)
    auto_cleanup_days: 0          # 自动清理N天前的调试文件，默认: 7 (0=不清理)

# 流式传输配置
streaming:
  heartbeat_interval: "30s"  # 心跳间隔，默认: 30s
  read_timeout: "10s"         # 读取超时，默认: 1s
  max_idle_time: "120s"      # 最大空闲时间，默认: 120s
  # 响应头超时配置 (v3.5.1新增)
  # 控制等待服务端首次响应头的最大时间
  # 对于AI服务(如Claude API)建议设置较长时间，以应对排队和预处理
  # 设置过短可能导致假超时和不必要的重试
  # 推荐范围: 30s-120s，根据实际服务响应时间调整
  response_header_timeout: "90s"

# Token计数配置
token_counting:
  enabled: true              # 是否启用count_tokens端点支持，默认: false

endpoints_storage:
  type: "sqlite"

# 使用跟踪配置
usage_tracking:
  enabled: true                          # 是否启用使用跟踪，默认: false
  # 应用核心数据库：Claude 端点、请求记录与运行状态共用同一 SQLite 文件。
  database:
    type: "sqlite"
    # path: "data/usage.db"       # 可选；桌面端默认使用应用数据目录下的 data/usage.db
  hot_pool:
      enabled: true           # 是否启用热池模式
      max_age: 30m            # 最大存活时间
      max_size: 10000         # 最大容量
      cleanup_interval: 10m    # 清理间隔
      archive_on_cleanup: true # 清理时归档  
  
  # 异步写入配置
  buffer_size: 1000                     # 事件缓冲区大小，默认: 1000
  batch_size: 15                        # 批量写入大小，默认: 100
  flush_interval: "5s"                  # 强制刷新间隔，默认: 30s
  max_retry: 5                           # 写入失败最大重试次数，默认: 3

# 代理配置 (可选)
proxy:
  enabled: false              # 是否启用代理
  type: "http"               # 代理类型: "http", "https", 或 "socks5"
  
  # 方式一: 完整代理 URL
  # url: "http://proxy.example.com:8080"
  # url: "https://proxy.example.com:8080"
  # url: "socks5://proxy.example.com:1080"
  
  # 方式二: 分别指定主机和端口
  host: "proxy.example.com"   # 代理主机
  port: 8080                  # 代理端口
  
  # 可选的认证信息
  # username: "proxy_user"    # 代理用户名
  # password: "proxy_pass"    # 代理密码

# Claude 端点只在桌面端的「Claude 端点」页面管理，不再从 YAML 读取。

# 账号池配置 (v6.0+)
# /v1/responses 专用于 Codex 账号池链路；endpoint 主要承载 Claude 相关请求
# 启用后 /v1/responses 请求走账号池；未启用时该端点不会回退到 endpoint
account_pool:
  enabled: true

  # 账号池失败策略配置
  # - 连接失败 / 连接超时 / DNS / TLS: 一次直接冷却
  # - 429 / 普通 5xx: 在软失败窗口内累计达到阈值后才进入冷却
  # - 命中 local_no_available_providers_marker 时: 透传且不计入冷却/窗口
  failure_policy:
    soft_failure_window: "5m"                    # 429/5xx 软失败统计窗口，默认: 5m
    soft_failure_threshold: 3                     # 软失败触发阈值，默认: 3
    respect_retry_after: true                     # 429 时是否优先使用上游 Retry-After，默认: true
    local_no_available_providers_marker: "no_available_providers::ccf_local"  # 本地 no_available_providers 透传标记

    cooldowns:
      connection_failure: "90s"                 # 连接失败 / 连接超时 / DNS / TLS 的冷却时间，默认: 90s
      processing_failure: "60s"                 # 响应处理异常的冷却时间，默认: 60s
      rate_limit_default: "180s"                # 429 无 Retry-After 时的默认冷却时间，默认: 180s
      server_error: "120s"                      # 普通 5xx 的冷却时间，默认: 120s
