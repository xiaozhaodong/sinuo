# Claude Request Forwarder Configuration
# 完整配置示例，展示所有可用的配置选项

# 全局时区配置 - 影响所有时间相关功能
# 留空或不配置时自动跟随系统时区（也可显式写 "local"）
# timezone: "Asia/Shanghai"    # 显式指定示例，其他有效值: "UTC", "America/New_York", "Europe/London" 等

# 服务器配置
server:
  host: "0.0.0.0"      # Docker环境中监听所有接口，默认: localhost
  port: 8087             # 监听端口，默认: 8080

# 健康检查配置
health:
  timeout: "5s"          # 健康检查超时，默认: 5s

# 日志配置
logging:
  level: "info"          # 日志级别: debug, info, warn, error，默认: info
  format: "json"         # 日志格式: "json" 或 "text"，默认: text

  # 文件日志配置 (可选)
  file_enabled: false            # 是否启用文件日志，默认: false
  file_path: "logs/app.log"      # 日志文件路径，默认: logs/app.log
  max_file_size: "100MB"         # 单个日志文件最大大小，支持: KB, MB, GB，默认: 100MB
  max_files: 10                  # 最多保留的轮转文件数量，默认: 10
  compress_rotated: true         # 是否压缩轮转的旧日志文件，默认: false
  disable_response_limit: true   # 启用文件日志时是否取消响应内容输出限制，默认: false

  # Token调试配置 - 用于调试Token解析失败问题
  token_debug:
    enabled: false                 # 是否启用Token调试功能，默认: false (生产环境建议关闭)
    save_path: "logs"             # 调试文件保存目录，默认: logs
    max_files: 50                 # 最大保留调试文件数量，默认: 50 (0=不限制)
    auto_cleanup_days: 7          # 自动清理N天前的调试文件，默认: 7 (0=不清理)

# 流式传输配置
streaming:
  heartbeat_interval: "30s"        # 心跳间隔，默认: 30s
  read_timeout: "10s"              # 读取超时，默认: 10s
  max_idle_time: "120s"            # 最大空闲时间，默认: 120s

  # 响应头超时配置 (v3.5.1新增)
  # 控制等待服务端首次响应头的最大时间
  # 对于AI服务(如Claude API)建议设置较长时间，以应对排队和预处理
  # 设置过短可能导致假超时和不必要的重试
  # 推荐范围: 30s-120s，根据实际服务响应时间调整
  response_header_timeout: "60s"   # 响应头超时，默认: 60s
  eof_retry_hint: false             # 流式传输中断时发送客户端重试提示，默认: false

# 账号池路由配置 (v6.0+)
# /v1/responses 专用于 Codex 账号池链路；endpoint 主要承载 Claude 相关请求
# 当 enabled=true 时，/v1/responses 走账号池链路；当 enabled=false 时，该端点不会回退到 endpoint
# 账号池数据依赖 usage_tracking 的 SQLite 数据库
account_pool:
  enabled: false              # 是否启用账号池路由，默认: false

  # 账号池失败策略配置
  # - 连接失败 / 连接超时 / DNS / TLS: 一次直接冷却
  # - 429 / 普通 5xx: 在软失败窗口内累计达到阈值后才进入冷却
  # - 命中 local_no_available_providers_marker 时: 透传且不计入冷却/窗口
  failure_policy:
    soft_failure_window: "5m"                    # 429/5xx 软失败统计窗口，默认: 5m
    soft_failure_threshold: 3                     # 软失败触发阈值，默认: 3
    respect_retry_after: true                     # 429 时是否优先使用上游 Retry-After，默认: true
    local_no_available_providers_marker: "no_available_providers::ccf_local"  # 本地 no_available_providers 透传标记

    cooldowns:
      connection_failure: "90s"                 # 连接失败 / 连接超时 / DNS / TLS 的冷却时间，默认: 90s
      processing_failure: "60s"                 # 响应处理异常的冷却时间，默认: 60s
      rate_limit_default: "180s"                # 429 无 Retry-After 时的默认冷却时间，默认: 180s
      server_error: "120s"                      # 普通 5xx 的冷却时间，默认: 120s

# 全局超时配置
global_timeout: "300s"       # 非流式请求的全局默认超时时间，默认: 300s (5分钟)

# 鉴权配置 (可选)
auth:
  enabled: false             # 是否启用鉴权，默认: false (不鉴权)
  # token: "your-bearer-token"  # Bearer Token，启用鉴权时必须设置

# TUI界面配置,如果部署在服务器上建议设置为 false
tui:
  enabled: false               # Docker环境中禁用TUI界面，默认: true
  update_interval: "1s"       # TUI刷新间隔，默认: 1s
  save_priority_edits: false  # 是否在TUI中保存优先级编辑到配置文件，默认: false（当前情况下保存配置文件可能会自动格式化配置文件）

# Web界面配置
web:
  enabled: true              # Docker环境中启用Web界面，默认: false
  host: "0.0.0.0"          # Web界面监听所有接口，默认: localhost
  port: 8088                 # Web界面端口，默认: 8088

# Token计数配置
token_counting:
  enabled: true              # 是否启用count_tokens端点支持，默认: false

# =================================================================
# 🗄️  Claude 端点存储配置
# =================================================================
# Runtime 只支持 SQLite；端点请在桌面端的「Claude 端点」页面管理。
# 旧 YAML endpoints 仅在首次升级迁移时读取，成功后会从活动配置中删除。
# =================================================================
endpoints_storage:
  type: "sqlite"

# 使用跟踪配置
# =================================================================
# 📊 使用情况追踪系统 (Usage Tracking)
# =================================================================
# 🪟 Windows兼容性保证: v1.0.2+ 完美支持Windows平台
# 🎯 数据库支持: SQLite (v4.1+ 仅支持 SQLite，热池架构无需外部数据库)
# =================================================================
usage_tracking:
  enabled: false                         # 是否启用使用跟踪，默认: false

  # =================================================================
  # 🗄️  数据库配置 (v4.1+: 仅支持 SQLite)
  # =================================================================
  # 💡 数据库中的时间点统一保存为 UTC；展示和业务日期仅使用文件顶部的全局 timezone。
  # 💡 v4.1.0: MySQL 支持已移除，热池架构下无需外部数据库依赖
  database:
    # =================================================================
    # 📁 SQLite配置 (开箱即用，无需安装任何外部服务)
    # =================================================================
    type: "sqlite"                        # 数据库类型: 仅支持 "sqlite"
    path: "data/usage.db"                 # SQLite数据库文件路径
    # database.timezone 已弃用，请勿配置；如旧配置保留该项，必须与顶层 timezone 完全一致。

    # 💡 SQLite说明:
    # - 使用纯Go SQLite驱动 (modernc.org/sqlite)，无CGO依赖
    # - 自动创建数据库文件和表结构 (首次运行时)
    # - 数据库文件可以直接复制用于备份和迁移
    # - 支持WAL模式，提供更好的并发性能
    # - 适合单机部署和轻量级使用
    # - 支持所有平台：Windows、Linux、macOS (Intel & Apple Silicon)
    # - v4.1.0 热池架构：活跃请求保持在内存中，减少80%数据库IO

  # =================================================================
  
  # 异步写入配置 - 本地使用优化
  buffer_size: 300                      # 事件缓冲区大小，默认: 1000 (本地使用减小)
  batch_size: 15                        # 批量写入大小，默认: 100 (本地使用减小，快速持久化)
  flush_interval: "8s"                  # 强制刷新间隔，默认: 30s (本地使用加快刷新)
  max_retry: 3                           # 写入失败最大重试次数，默认: 3
  
  # 📈 性能特点:
  # - 完全异步处理，不影响请求转发性能
  # - 批量写入，减少数据库I/O开销
  # - 自动故障恢复，数据完整性保障
  # - 内存缓冲，平滑处理突发请求
  
  # 数据保留策略
  retention_days: 0                     # 数据保留天数，默认: 0（永久保留）
  cleanup_interval: "24h"                # 清理任务执行间隔，默认: 24h

  # =================================================================
  # 🔥 v4.1 热池配置 (可选，默认启用)
  # =================================================================
  # 热池架构: 活跃请求保持在内存中，只在完成时写入数据库
  # 优势: 减少80%数据库写入，提升100x实时查询性能
  hot_pool:
    enabled: true                       # 是否启用热池模式，默认: true
    max_age: "30m"                      # 请求最大存活时间，超时自动归档，默认: 30m
    max_size: 10000                     # 热池最大容量，默认: 10000
    cleanup_interval: "1m"              # 僵尸请求清理间隔，默认: 1m
    archive_on_cleanup: true            # 清理时是否归档到数据库，默认: true

  # 💡 热池说明:
  # - 活跃请求全程保持在内存中，减少数据库锁竞争
  # - 每个请求仅在结束时写入 1 次数据库（原来需要 5 次）
  # - 自动降级：热池满时自动切换到传统事件队列模式
  # - 崩溃保护：进程退出时自动归档所有未完成请求

  # 📊 数据统计功能:
  # - Token使用量统计 (输入/输出/缓存创建/缓存读取)
  # - 成本分析 (基于模型定价自动计算)
  # - 端点性能监控 (响应时间、成功率)
  # - 请求生命周期追踪 (完整的请求流程记录)
  # - Web界面实时查看，支持CSV/JSON导出

  # ============================================================
  # 💰 模型定价配置 (v5.0+ 重要变更)
  # ============================================================
  # v5.0+ 版本起，模型定价已迁移到 SQLite 数据库管理！
  #
  # 管理方式：
  #   - 通过前端「定价」页面进行增删改查
  #   - 数据存储在 SQLite model_pricing 表中
  #   - 支持 5分钟/1小时 两种缓存 TTL 的独立定价
  #
  # 默认定价（首次启动时自动初始化）：
  #   - Claude Sonnet 4.5: $3/$15 (input/output)
  #   - Claude Haiku 4.5:  $1/$5
  #   - Claude Opus 4.5:   $5/$25
  #   - 以及其他常用模型...
  #
  # 注意：以下配置已废弃，仅为向后兼容保留，不会被使用
  # model_pricing: {}
  # default_pricing: {}
  # ============================================================

# 代理配置 (可选)
proxy:
  enabled: false              # 是否启用代理
  type: "http"               # 代理类型: "http", "https", 或 "socks5"
  
  # 方式一: 完整代理 URL
  # url: "http://proxy.example.com:8080"
  # url: "https://proxy.example.com:8080"
  # url: "socks5://proxy.example.com:1080"
  
  # 方式二: 分别指定主机和端点
  host: "proxy.example.com"   # 代理主机
  port: 8080                  # 代理端口
  
  # 可选的认证信息
  # username: "proxy_user"    # 代理用户名
  # password: "proxy_pass"    # 代理密码

# Claude 端点表中每行是一条独立记录，可分别设置 Token、API Key、
# 优先级、硬启用、自动调度、count_tokens、模型改写和成本倍率。
# 一条记录可同时携带 Token 与 API Key；密钥仅能显式更新或删除，不会回显明文。
