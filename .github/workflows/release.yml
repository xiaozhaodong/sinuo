name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    strategy:
      matrix:
        platform:
          - darwin/amd64
          - darwin/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Get version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          # main.go 的 Version 不带 v 前缀，注入时剥掉；Release 标题仍用带 v 的 VERSION
          echo "VERSION_NUM=${VERSION#v}" >> $GITHUB_ENV
          echo "COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Build
        run: |
          PLATFORM="${{ matrix.platform }}"
          ARCH="${PLATFORM#*/}"
          wails3 task darwin:package ARCH="$ARCH" LDFLAGS="-w -s -X main.Version=${{ env.VERSION_NUM }} -X main.Commit=${{ env.COMMIT }} -X main.BuildTime=${{ env.BUILD_TIME }}"

      - name: Package
        run: |
          PLATFORM="${{ matrix.platform }}"
          ARCH="${PLATFORM#*/}"
          cd bin

          # 创建 ZIP
          if [ -d "Sinuo.app" ]; then
            zip -r "Sinuo-darwin-${ARCH}.zip" "Sinuo.app"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sinuo-darwin-${{ matrix.platform == 'darwin/amd64' && 'amd64' || 'arm64' }}
          path: bin/*.zip

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Get version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          # main.go 的 Version 不带 v 前缀，注入时剥掉；Release 标题仍用带 v 的 VERSION
          echo "VERSION_NUM=${VERSION#v}" >> $GITHUB_ENV
          echo "COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Build
        run: wails3 task windows:build ARCH=amd64 LDFLAGS="-w -s -H windowsgui -X main.Version=${{ env.VERSION_NUM }} -X main.Commit=${{ env.COMMIT }} -X main.BuildTime=${{ env.BUILD_TIME }}"

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "bin/Sinuo.exe" -DestinationPath "bin/Sinuo-windows-amd64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sinuo-windows-amd64
          path: bin/*.zip

  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Get version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          # main.go 的 Version 不带 v 前缀，注入时剥掉；Release 标题仍用带 v 的 VERSION
          echo "VERSION_NUM=${VERSION#v}" >> $GITHUB_ENV
          echo "COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Build
        run: wails3 task linux:build ARCH=amd64 LDFLAGS="-w -s -X main.Version=${{ env.VERSION_NUM }} -X main.Commit=${{ env.COMMIT }} -X main.BuildTime=${{ env.BUILD_TIME }}"

      - name: Package
        run: |
          cd bin
          tar -czf "Sinuo-linux-amd64.tar.gz" "Sinuo"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sinuo-linux-amd64
          path: bin/*.tar.gz

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release files
        env:
          SINUO_UPDATE_SIGNING_KEY: ${{ secrets.SINUO_UPDATE_SIGNING_KEY }}
        run: |
          mkdir -p release/
          find artifacts/ -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release/ \;

          shopt -s nullglob
          packages=(release/*.zip release/*.tar.gz)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No release packages found" >&2
            exit 1
          fi
          go run ./scripts/release-sign sign "${packages[@]}"

          cd release/
          sha256sum * > checksums.txt
          ls -la

      - name: Get version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Prepare release notes
        run: |
          bash scripts/release-notes.sh "${VERSION#v}" > release-body.md
          cat >> release-body.md <<'RELEASE_BODY'

          <!-- sinuo:release-notes-end -->

          ### 下载

          | 平台 | 文件 |
          |------|------|
          | macOS (Intel) | `Sinuo-darwin-amd64.zip` |
          | macOS (Apple Silicon) | `Sinuo-darwin-arm64.zip` |
          | Windows | `Sinuo-windows-amd64.zip` |
          | Linux | `Sinuo-linux-amd64.tar.gz` |

          ### 安装说明

          **macOS**: 解压后将 `Sinuo.app` 拖入应用程序文件夹
          **Windows**: 解压后运行 `Sinuo.exe`
          **Linux**: 解压后运行 `Sinuo`

          ### 校验

          `.sig` 是供 App 内一键更新使用的 ed25519 签名。

          ```bash
          sha256sum -c checksums.txt
          ```

          详细更新内容请查看 [CHANGELOG.md](./CHANGELOG.md)
          RELEASE_BODY

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Sinuo ${{ env.VERSION }}
          body_path: release-body.md
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
